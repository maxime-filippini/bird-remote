<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bird Remote</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
#bird{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .3s}
#bird.ready{opacity:1}
</style></head><body><img id="bird" alt="">
<script>
let shown=0;
function show(b){
  if(!b||b.version===shown)return;
  const preload=new Image();
  preload.onload=()=>{
    const image=document.querySelector('#bird');
    image.src=b.image_url;
    image.alt='';
    shown=b.version;
    requestAnimationFrame(()=>image.classList.add('ready'));
  };
  preload.src=b.image_url;
}
async function refresh(){
  try{
    const response=await fetch('/api/current',{cache:'no-store'});
    if(response.ok)show(await response.json());
  }catch{}
}
refresh();
const events=new EventSource('/api/events');
events.addEventListener('bird',event=>show(JSON.parse(event.data)));
events.onerror=refresh;
</script></body></html>
